<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420" role="img" aria-labelledby="title desc">
<title id="title">Cooperative exploration and target search</title>
<desc id="desc">Odometry and IMU fusion provides local state estimation. The exploration cycle updates a shared LiDAR map, detects frontiers, assigns robots and executes navigation. Visual target detection runs alongside exploration.</desc>
