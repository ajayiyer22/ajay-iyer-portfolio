<text x="24" y="65" font-size="17" fill="#52625e">One Husky and two Jackals share a map and divide the search.</text>
<rect x="24" y="86" width="792" height="46" rx="6" fill="#dce9dd"/>
<text x="42" y="115" font-size="21" fill="#164f42">Localization: odometry + IMU fusion with an EKF</text>
